name: Build Orbit OS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm archiso arch-install-scripts grub git jq curl
      - uses: actions/checkout@v4
      - name: Build Orbit OS ISO
        run: |
          set -e
          P=iso/configs/archiso-profile
          chmod +x $P/airootfs/usr/local/bin/*
          chmod +x $P/airootfs/etc/skel/.config/qtile/autostart.sh
          mkarchiso -v -w /tmp/archiso-work -o iso/out $P
      - uses: actions/upload-artifact@v4
        with:
          name: orbit-os-iso
          path: iso/out/*.iso
      - name: Prepare release files
        run: |
          set -e
          cd iso/out
          sha256sum *.iso > SHA256SUMS
          # GitHub release assets are limited to 2 GiB (2147483648 bytes); split only if larger
          if [ "$(stat -c%s *.iso)" -gt 2147000000 ]; then
            split -b 1900M -d *.iso orbit-os.iso.part
            rm -f *.iso
            echo "ISO was split. Rejoin with: cat orbit-os.iso.part* > orbit-os.iso" > README-JOIN.txt
          fi
          ls -lh
      - name: Remove previous latest-iso release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          API=https://api.github.com/repos/${{ github.repository }}
          ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" $API/releases/tags/latest-iso | jq -r '.id // empty')
          if [ -n "$ID" ]; then curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" $API/releases/$ID; fi
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" $API/git/refs/tags/latest-iso || true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-iso
          name: Orbit OS v1.0.0 (${{ github.sha }})
          body: Automated Orbit OS (Hyprland + Qtile, Python GTK4 Orbit Suite, LazyVim) ISO build of commit ${{ github.sha }}
          files: iso/out/*
