background {
    monitor =
    path = /home/jacob/.config/background.png 
    blur_passes = 2
    blur_size = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.23
    dots_spacing = 0.15
    dots_center = true
    fade_on_empty = false
    placeholder_text = <span foreground="#c0caf5"><i>Password...</i></span>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
    color = #c0caf5
    outer_color = #3b4261
    inner_color = #1a1b26
    font_color = #c0caf5
    check_color = #7aa2f7
    fail_color = #f7768e
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%I:%M %p")"
    color = #c0caf5
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = #7aa2f7
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}
