# =============================================================================
# Jacob's Custom Hyprland Configuration (Native hyprland.conf)
# Synced with ~/.config/hypr/hyprland.lua & ~/.config/hypr/modules/*.lua
# =============================================================================

# ------------------
# ---- MONITORS ----
# ------------------
monitor = HDMI-A-1, 1920x1080@60, 0x0, 1
monitor = DP-1, 1920x1080@60, 1920x0, 1
monitor = , preferred, auto, 1

workspace = 1, monitor:HDMI-A-1
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:DP-1
workspace = 7, monitor:DP-1
workspace = 8, monitor:DP-1
workspace = 9, monitor:DP-1
workspace = 10, monitor:DP-1

# -------------------------------
# ---- ENVIRONMENT VARIABLES ----
# -------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
env = __GL_MAX_FRAMES_ALLOWED,1
env = WLR_NO_HARDWARE_CURSORS,0
env = HYPRLAND_NO_SD_NOTIFY,1

# -------------------
# ---- AUTOSTART ----
# -------------------
exec-once = kitty
exec-once = nm-applet
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = wl-paste --type text --watch cliphist store
exec-once = awww-daemon
exec-once = sh ~/.config/hypr/wallpaper_loop.sh
exec-once = quickshell

# -----------------------
# ---- LOOK AND FEEL ----
# -----------------------
general {
    gaps_in = 2
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.1696
        new_optimizations = true
        xray = true
    }
}

animations {
    enabled = true
}

# -------------------------
# ---- INPUT & LAYOUTS ----
# -------------------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ----------------------
# ---- WINDOW RULES ----
# ----------------------
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = nofocus, class:^$, title:^$, xwayland:1, floating:1, fullscreen:0, pinned:0
windowrulev2 = float, class:^(hyprland-run)$
windowrulev2 = move 20 100%-120, class:^(hyprland-run)$
windowrulev2 = idleinhibit always, class:^(looking-glass-client)$

# ------------------
# ---- KEYBINDS ----
# ------------------
$mainMod = SUPER

# Core App Binds
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod, W, exec, looking-glass-client egl:scale=2 win:autoResize=yes
bind = $mainMod, C, killactive,
bind = $mainMod, D, exec, discord

# App Launcher / Menu (Quickshell IPC Call)
bindr = SUPER, Super_L, exec, quickshell ipc call drawer toggle
bind = $mainMod, SPACE, exec, quickshell ipc call drawer toggle

# System Management
bind = $mainMod, R, exec, notify-send 'Quickshell' 'Active!'
bind = $mainMod SHIFT, R, exec, sh -c 'hyprctl reload && notify-send "Hyprland" "Reloaded!"'

# Quickshell Menus
bind = $mainMod, K, exec, quickshell ipc call keybinds toggle
bind = $mainMod, Q, exec, quickshell ipc call powermenu toggle
bind = $mainMod, N, exec, quickshell ipc call notifications toggle
bind = $mainMod, M, exec, quickshell ipc call media toggle
bind = $mainMod SHIFT, V, exec, quickshell ipc call clipboard toggle
bind = $mainMod, L, exec, quickshell ipc call calendar toggle
bind = $mainMod, I, exec, quickshell ipc call controlcenter toggle

# Window Management
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, TAB, focusmonitor, +1

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special Workspace
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Mouse Window Interactions
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = , mouse:274, movewindow

# Volume Controls via Quickshell IPC
binde = $mainMod, equal, exec, quickshell ipc call volume up
binde = $mainMod, minus, exec, quickshell ipc call volume down
bind = $mainMod, BackSpace, exec, quickshell ipc call volume mute
binde = , XF86AudioRaiseVolume, exec, quickshell ipc call volume up
binde = , XF86AudioLowerVolume, exec, quickshell ipc call volume down
bind = , XF86AudioMute, exec, quickshell ipc call volume mute
