# Orbit Desktop — Standard Upstream Hyprland Configuration (Arch Linux)
# Used on Orbit OS ISO and fresh Arch Linux installations.

monitor = , preferred, auto, 1

env = XDG_CURRENT_DESKTOP,X-Hyprland-Standalone:Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,X-Hyprland-Standalone
env = GDK_SCALE,1
env = XCURSOR_SIZE,24
env = GTK_THEME,Dracula
env = EDITOR,orbit-nvim-cli

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = hyprpaper -c $HOME/.config/hypr-standalone/hyprpaper.conf
exec-once = /usr/local/bin/orbit-shell
exec-once = dunst

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(bd93f9ee)
    col.inactive_border = rgba(44475aaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 11
    active_opacity = 1.0
    inactive_opacity = 0.96

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
        popups = true
        new_optimizations = true
    }
}

animations {
    enabled = true
}

dwindle {
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

$mainMod = SUPER

# Orbit Suite + LazyVim
bind = $mainMod, Return, exec, orbit-term
bind = $mainMod, E, exec, orbit-files
bind = $mainMod, D, exec, orbit-launch
bind = $mainMod, R, exec, orbit-launch
bind = , F24, exec, orbit-launch
bind = $mainMod SHIFT, D, exec, rofi -show drun
bind = $mainMod, N, exec, orbit-nvim
bind = $mainMod, W, exec, orbit-theme
bind = $mainMod, B, exec, brave

# Window & Monitor Management
bind = $mainMod, C, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, J, togglesplit,
bind = $mainMod, Tab, focusmonitor, +1
bind = $mainMod SHIFT, R, exec, sh -c 'hyprctl reload && (pkill -f "[o]rbit_suite\.shell"; setsid /usr/local/bin/orbit-shell >/dev/null 2>&1 &)'
bind = $mainMod SHIFT, Q, exit,

# Focus movement
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Volume & Brightness
bindel = $mainMod, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = $mainMod, minus, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = $mainMod, BackSpace, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Mouse move/resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = , mouse:274, movewindow
