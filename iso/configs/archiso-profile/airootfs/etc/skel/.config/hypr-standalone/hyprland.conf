-- Standalone Hyprland configuration (independent of Omarchy)
-- Native Hyprland 0.57+ Lua API, matching your frosted-glass look & Orbit Suite.

local HOME = os.getenv("HOME") or ""
local function bin(name)
  local p = HOME .. "/.local/bin/" .. name
  local f = io.open(p, "r")
  if f then
    f:close()
    return p
  end
  return name
end

-- ---------------------------------------------------------------------------
-- Environment
-- ---------------------------------------------------------------------------
hl.env("XDG_CURRENT_DESKTOP", "X-Hyprland-Standalone:Hyprland")
hl.env("XDG_SESSION_TYPE", "wayland")
hl.env("XDG_SESSION_DESKTOP", "X-Hyprland-Standalone")
hl.env("GDK_SCALE", "1")
hl.env("XCURSOR_SIZE", "24")
hl.env("GTK_THEME", "Dracula")
hl.env("EDITOR", bin("orbit-nvim-cli"))

-- ---------------------------------------------------------------------------
-- Monitors (dual 1920x1080 @ 100Hz on RTX 5070)
-- ---------------------------------------------------------------------------
hl.monitor({ output = "HDMI-A-1", mode = "1920x1080@100", position = "0x0", scale = 1 })
hl.monitor({ output = "DP-2", mode = "1920x1080@100", position = "1920x0", scale = 1 })
hl.monitor({ output = "", mode = "preferred", position = "auto", scale = 1 })

-- ---------------------------------------------------------------------------
-- Look & Feel (frosted glass, Tokyonight/Dracula borders, NVIDIA stability)
-- ---------------------------------------------------------------------------
hl.config({
  general = {
    gaps_in = 3,
    gaps_out = 6,
    border_size = 2,
    ["col.active_border"] = "rgba(bd93f9ee)",
    ["col.inactive_border"] = "rgba(44475aaa)",
    layout = "dwindle",
    resize_on_border = true,
    snap = {
      enabled = true,
      window_gap = 10,
      monitor_gap = 7,
      respect_gaps = true,
    },
  },

  decoration = {
    rounding = 11,
    active_opacity = 1.0,
    inactive_opacity = 0.95,

    shadow = {
      enabled = true,
      range = 16,
      render_power = 3,
      color = "rgba(7d5fa344)",
      color_inactive = "rgba(00000055)",
    },

    blur = {
      enabled = true,
      size = 6,
      passes = 4,
      vibrancy = 0.2,
      popups = true,
      new_optimizations = true,
      xray = false,
    },
  },

  animations = {
    enabled = true,
  },

  dwindle = {
    preserve_split = true,
  },

  input = {
    kb_layout = "us",
    follow_mouse = 1,
    sensitivity = 0,
  },

  cursor = {
    no_hardware_cursors = true,
  },

  render = {
    direct_scanout = 0,
  },

  misc = {
    force_default_wallpaper = 0,
    disable_hyprland_logo = true,
  },
})

-- ---------------------------------------------------------------------------
-- Autostart (Waybar, Dunst, Hyprpaper)
-- ---------------------------------------------------------------------------
hl.on("hyprland.start", function()
  hl.exec_cmd("dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP")
  hl.exec_cmd("/usr/lib/hyprpolkitagent/hyprpolkitagent")
  hl.exec_cmd("hyprpaper -c " .. HOME .. "/.config/hypr-standalone/hyprpaper.conf")
  hl.exec_cmd(bin("orbit-shell"))
  hl.exec_cmd("dunst")
end)

-- ---------------------------------------------------------------------------
-- Helper for concise bindings
-- ---------------------------------------------------------------------------
local function bind(keys, action, desc, opts)
  local o = opts or {}
  if desc then
    o.description = desc
  end
  if type(action) == "string" then
    action = hl.dsp.exec_cmd(action)
  end
  hl.bind(keys, action, o)
end

-- ---------------------------------------------------------------------------
-- Apps (Orbit Suite + LazyVim + Rofi fallback)
-- ---------------------------------------------------------------------------
bind("SUPER + RETURN", bin("orbit-term"), "Orbit Term")
bind("SUPER + E", bin("orbit-files"), "Orbit Files")
bind("SUPER + D", bin("orbit-launch"), "Orbit Launch")
bind("SUPER + R", bin("orbit-launch"), "Orbit Launch")
bind("F24", bin("orbit-launch"), "Orbit Launch")
bind("SUPER + SHIFT + D", "rofi -show drun", "Rofi Launcher")
bind("SUPER + N", bin("orbit-nvim"), "Orbit Edit (LazyVim)")
bind("SUPER + B", "brave", "Browser")

-- ---------------------------------------------------------------------------
-- Window & Monitor Management (your personal muscle memory)
-- ---------------------------------------------------------------------------
bind("SUPER + C", hl.dsp.window.close(), "Close window")
bind("SUPER + V", hl.dsp.window.float({ action = "toggle" }), "Toggle floating")
bind("SUPER + F", hl.dsp.window.fullscreen({ mode = "fullscreen" }), "Fullscreen")
bind("SUPER + J", hl.dsp.layout("togglesplit"), "Toggle split")
bind("SUPER + TAB", hl.dsp.focus({ monitor = "+1" }), "Focus next monitor")
bind("SUPER + SHIFT + R", "sh -c 'hyprctl reload && (pkill -f \"[o]rbit_suite\\.shell\"; setsid " .. bin("orbit-shell") .. " >/dev/null 2>&1 &)'", "Reload Hyprland & Orbit Shell")
bind("SUPER + SHIFT + Q", hl.dsp.exit(), "Exit Hyprland")

-- Focus movement
bind("SUPER + LEFT", hl.dsp.focus({ direction = "l" }), "Focus left")
bind("SUPER + RIGHT", hl.dsp.focus({ direction = "r" }), "Focus right")
bind("SUPER + UP", hl.dsp.focus({ direction = "u" }), "Focus up")
bind("SUPER + DOWN", hl.dsp.focus({ direction = "d" }), "Focus down")

-- Workspaces 1-10
for ws = 1, 10 do
  local key = (ws == 10) and "0" or tostring(ws)
  bind("SUPER + " .. key, hl.dsp.focus({ workspace = tostring(ws) }), "Workspace " .. ws)
  bind("SUPER + SHIFT + " .. key, hl.dsp.window.move({ workspace = tostring(ws) }), "Move to workspace " .. ws)
end

-- Volume controls
bind("SUPER + equal", "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+", "Volume up", { locked = true, repeating = true })
bind("SUPER + minus", "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-", "Volume down", { locked = true, repeating = true })
bind("SUPER + BACKSPACE", "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle", "Mute toggle", { locked = true })

-- Mouse bindings (Super+LMB move, Super+RMB resize, Middle-click drag)
hl.bind("SUPER + mouse:272", hl.dsp.window.drag(), { mouse = true })
hl.bind("SUPER + mouse:273", hl.dsp.window.resize(), { mouse = true })
hl.bind("mouse:274", hl.dsp.window.drag(), { mouse = true })

-- ---------------------------------------------------------------------------
-- Window & Layer Rules (frosted glass behind Waybar/Rofi + centered Orbit Launch)
-- ---------------------------------------------------------------------------
hl.layer_rule({
  match = { namespace = "^(orbit-top-bar|orbit-bottom-dock|waybar|rofi)$" },
  blur = true,
  ignore_alpha = 0.05,
})

hl.window_rule({
  match = { class = "^dev\\.orbit\\.Launch$" },
  float = true,
  center = true,
})
