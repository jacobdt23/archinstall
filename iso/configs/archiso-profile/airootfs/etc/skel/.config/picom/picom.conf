# =============================================================================
# HyprFrost Picom Configuration (X11 Compositor)
# Optimized for NVIDIA RTX, High-FPS Gaming, and Tokyo Night Aesthetics
# =============================================================================

#################################
#             Backend           #
#################################
backend = "glx";
glx-copy-from-front = false;
use-damage = true;
vsync = true;

#################################
#       Gaming & Unredirect     #
#################################
# Unredirect fullscreen windows to give games (e.g. Hogwarts Legacy)
# direct 100% native GPU scanout with zero latency and zero micro-stutter
unredir-if-possible = true;
unredir-if-possible-delay = 0;
unredir-if-possible-exclude = [];

#################################
#            Corners            #
#################################
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.50;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#0f111a";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "window_type = 'dock'",
    "_GTK_FRAME_EXTENTS@"
];

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
no-fading-openclose = false;

fade-exclude = [];

#################################
#          Transparency         #
#################################
active-opacity = 1.0;
inactive-opacity = 0.96;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Steam'"
];

#################################
#     Window-Type Settings      #
#################################
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.98; };
    dropdown_menu = { opacity = 0.98; };
};
