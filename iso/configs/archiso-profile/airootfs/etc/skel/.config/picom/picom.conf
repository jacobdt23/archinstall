# =============================================================================
# HyprFrost Picom Configuration (X11 Compositor)
# Optimized for NVIDIA RTX, High-FPS Gaming, and Tokyo Night Aesthetics
# =============================================================================

#################################
#             Backend           #
#################################
backend = "glx";
glx-copy-from-front = false;
use-damage = true;
vsync = true;

#################################
#       Gaming & Unredirect     #
#################################
# Unredirect fullscreen windows to give games (e.g. Hogwarts Legacy)
# direct 100% native GPU scanout with zero latency and zero micro-stutter
unredir-if-possible = true;
unredir-if-possible-delay = 0;
unredir-if-possible-exclude = [];

#################################
#            Corners            #
#################################
corner-radius = 10;
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#             Shadows           #
#################################
shadow = true;
shadow-radius = 16;
shadow-opacity = 0.50;
shadow-offset-x = -16;
shadow-offset-y = -16;
shadow-color = "#0f111a";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "window_type = 'dock'",
    "_GTK_FRAME_EXTENTS@"
];

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 5;
no-fading-openclose = false;

fade-exclude = [];

#################################
#          Transparency         #
#################################
active-opacity = 1.0;
inactive-opacity = 0.88;
frame-opacity = 1.0;
inactive-opacity-override = false;

focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'slop'",
    "class_g = 'Steam'",
    "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'"
];

opacity-rule = [
    # Fullscreen & Gaming (100% solid, zero latency)
    "100:_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'",
    "100:name *?= 'Hogwarts'",
    "100:class_g = 'Steam'",
    "100:class_g = 'steam_app_'",

    # Web Browsers
    "100:class_g = 'Brave-browser' && focused",
    "95:class_g = 'Brave-browser' && !focused",
    "100:class_g = 'firefox' && focused",
    "95:class_g = 'firefox' && !focused",

    # Terminals (Frosted Glass)
    "90:class_g = 'kitty' && focused",
    "80:class_g = 'kitty' && !focused",
    "90:class_g = 'Alacritty' && focused",
    "80:class_g = 'Alacritty' && !focused",

    # File Managers & Launchers
    "92:class_g = 'thunar' && focused",
    "85:class_g = 'thunar' && !focused",
    "92:class_g = 'Thunar' && focused",
    "85:class_g = 'Thunar' && !focused",
    "92:class_g = 'Rofi'",

    # Audio & Chat Apps
    "90:class_g = 'discord'",
    "90:class_g = 'Discord'",
    "90:class_g = 'Spotify'",
    "92:class_g = 'pavucontrol'",
    "92:class_g = 'org.pulseaudio.pavucontrol'"
];

#################################
#        Background Blur        #
#################################
blur: {
    method = "dual_kawase";
    strength = 6;
    background = true;
    background-frame = false;
    background-fixed = false;
};

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@",
    "class_g = 'slop'",
    "_NET_WM_STATE *= '_NET_WM_STATE_FULLSCREEN'"
];

#################################
#     Window-Type Settings      #
#################################
wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.95; focus = true; full-shadow = false; };
    dock = { shadow = false; clip-shadow-above = true; opacity = 0.92; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; };
    dropdown_menu = { opacity = 0.95; };
};
