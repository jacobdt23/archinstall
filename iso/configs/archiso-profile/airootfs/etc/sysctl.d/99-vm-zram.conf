# =============================================================================
# HyprFrost Virtual Memory Tuning for zram
# Recommended systemd & kernel settings for high-performance compressed RAM swap
# =============================================================================

# High swappiness encourages proactive compression of cold anonymous memory into zram
vm.swappiness = 180

# Disable watermark boosting to prevent aggressive background reclaim latency
vm.watermark_boost_factor = 0

# Reserve 1.25% of memory for page allocations to eliminate allocation stalls
vm.watermark_scale_factor = 125

# zram is RAM with zero seek time; page-cluster = 0 avoids wasted multi-page readahead
vm.page-cluster = 0
