#
# /etc/pacman.conf
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
NoExtract   = usr/share/wayland-sessions/hyprland-uwsm.desktop

Color
ILoveCandy
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Omarchy repository placed after core/extra/multilib so stock Arch linux + nvidia-open stay matched
[omarchy]
SigLevel = Required DatabaseOptional
Server = https://pkgs.omarchy.org/edge/$arch
