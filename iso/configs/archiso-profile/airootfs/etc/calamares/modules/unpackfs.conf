---
# calamares-find-rootfs (shellprocess@prep) mounts the live rootfs here.
unpack:
    - source: "/run/calamares-rootfs"
      sourcefs: "file"
      destination: ""
      # /boot is the (FAT) EFI partition on UEFI; kernel+initramfs are installed by calamares-post-install
      exclude: [ "/boot/" ]
