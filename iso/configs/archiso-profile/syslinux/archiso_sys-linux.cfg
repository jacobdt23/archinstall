LABEL arch
TEXT HELP
Boot Jacob's Custom Arch Linux live environment on BIOS/MBR.
Allows using the live Hyprland desktop or installing to disk.
ENDTEXT
MENU LABEL Jacob's Custom Arch Linux (%ARCH%, BIOS/MBR)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot Jacob's Custom Arch Linux on BIOS/MBR with speakup screen reader.
ENDTEXT
MENU LABEL Jacob's Custom Arch Linux (%ARCH%, BIOS/MBR) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% accessibility=on
